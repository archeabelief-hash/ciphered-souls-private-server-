name: Build and Publish Elder Souls Scape PK Training v0.3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-elder-souls-v0.2.yml'
      - 'tools/build-elder-souls-pk-training.ps1'
      - 'tools/apply-elder-souls-pk-training.ps1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and publish public Elder Souls Scape PK Training v0.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/build-elder-souls-pk-training.ps1

      - name: Upload build hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elder-souls-scape-pk-training-v0.3-build-report
          path: output/SHA256.txt
          if-no-files-found: ignore
          retention-days: 7
