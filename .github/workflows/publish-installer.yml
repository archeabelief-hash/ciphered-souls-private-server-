name: Publish Ciphered Souls Installer
on:
  push:
    paths:
      - '.github/workflows/publish-installer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer parts from temporary artifact links
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c040-81f5-9abf-b9faaf33ce9f/raw?se=2026-09-13T20%3A39%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=c860b473-4359-554b-af95-03b9a4a6f1c7&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A17%3A10Z&ske=2026-09-14T00%3A17%3A10Z&sks=b&skv=2026-02-06&sig=3mKb8NoCHy3/yGMmXJw5kpdwvNjupqX2WF%2BL2Cx4jN8%3D' -o part00.zip
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f758-81f5-9296-0252e4dee434/raw?se=2026-09-13T20%3A39%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=acbdd182-02f8-53c7-b711-d5c25c45eb53&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T17%3A05%3A24Z&ske=2026-09-14T17%3A05%3A24Z&sks=b&skv=2026-02-06&sig=6l3tU3gaxGlM/PvxYK8LVkzOp/OhSbarC96KHZC4A9g%3D' -o part01.zip
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e96c-81f5-8e19-bfdea589396f/raw?se=2026-09-13T20%3A40%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=bcc10cf4-f1f7-512e-8a64-7eae6c5bf90e&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A10%3A48Z&ske=2026-09-14T00%3A10%3A48Z&sks=b&skv=2026-02-06&sig=u8cqlhj/dMF8Ley3XlqpKoc3GXj6P/Poyj0j4c9YfDg%3D' -o part02.zip
          unzip -q part00.zip -d p0
          unzip -q part01.zip -d p1
          unzip -q part02.zip -d p2
          find p0 p1 p2 -maxdepth 2 -type f -printf '%p %s\n'
          cat p0/* p1/* p2/* > Ciphered-Souls-718-Setup.exe
          echo '78659212aad03ed323f7ad27cec813cf2178c92d0998989936047098cd04aecf  Ciphered-Souls-718-Setup.exe' | sha256sum -c -
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete ciphered-souls-local-718-v0.1.0 --yes 2>/dev/null || true
          gh release create ciphered-souls-local-718-v0.1.0 Ciphered-Souls-718-Setup.exe \
            --title 'Ciphered Souls Local 718 v0.1.0' \
            --notes 'Windows installer for the local-only Ciphered Souls Matrix 718 build. Includes bundled Java runtime and cache.'
