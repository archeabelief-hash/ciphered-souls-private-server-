name: Inspect Account Persistence And Owner Commands

on:
  push:
    branches: [ elder-souls-osrs-mechanics ]
    paths:
      - '.github/workflows/inspect-account-owner.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recover server source and inspect account/command system
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/server/.git/objects/pack
          git -C recovered/server init >/dev/null
          curl -L --fail -o recovered/server/.git/objects/pack/pack-a0e3d5d13ccfe8addde9e81f30decc1fcb0b493f.pack 'https://drive.usercontent.google.com/download?id=1yao606p_04R7yXH9vsdMitsLz1t-LB79&export=download&confirm=t'
          curl -L --fail -o recovered/server/.git/objects/pack/pack-a0e3d5d13ccfe8addde9e81f30decc1fcb0b493f.idx 'https://drive.usercontent.google.com/download?id=1z_1DeNJMqx70GNjvlnOqL3FQThDmqaC3&export=download&confirm=t'
          git -C recovered/server reset --hard 61999df3c7a90e50b8ffb7000433d09d621c2ac7 >/dev/null

          echo '=== COMMAND FILES ==='
          find recovered/server/src/main/java -iname '*Command*.java' -o -iname 'Commands.java' | sort
          echo '=== RIGHTS REFERENCES ==='
          grep -RniE 'getRights\(|setRights\(|rights ==|rights >|rights <|playerRights|OWNER|ADMIN' recovered/server/src/main/java/com/rs/game/player recovered/server/src/main/java/com/rs/net 2>/dev/null | head -500 || true
          echo '=== SAVE LOAD REFERENCES ==='
          grep -RniE 'SerializableFilesManager|savePlayer|loadPlayer|player.*save|playersaves|players/' recovered/server/src/main/java 2>/dev/null | head -500 || true
          echo '=== SETTINGS DATA PATH ==='
          grep -nE 'DATA_PATH|WORLD_ID|HOSTED' recovered/server/src/main/java/com/rs/Settings.java | head -80 || true
          echo '=== COMMAND CORE ==='
          f=$(find recovered/server/src/main/java -iname 'Commands.java' | head -1)
          [ -n "$f" ] && sed -n '1,1400p' "$f" || true
          echo '=== SERIALIZATION CORE ==='
          f=$(find recovered/server/src/main/java -iname 'SerializableFilesManager.java' | head -1)
          [ -n "$f" ] && sed -n '1,140p' "$f" || true
