name: Audit Elder Souls RPG Alpha Branding

on:
  workflow_dispatch:
  push:
    branches:
      - elder-souls-osrs-mechanics
    paths:
      - '.github/workflows/audit-elder-souls-branding.yml'
      - 'tools/audit-elder-souls-branding.ps1'

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Audit Matrix and legacy branding references
        shell: pwsh
        run: ./tools/audit-elder-souls-branding.ps1
