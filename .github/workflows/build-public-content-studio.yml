name: Build Public Elder Souls Content Studio

on:
  push:
    branches: [ elder-souls-osrs-mechanics ]
    paths:
      - 'tools/elder_souls_studio/**'
      - '.github/workflows/build-public-content-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install packager
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Get FileStore and compile cache bridge
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/samgrims/718_RS_Build.git matrix-base
          Copy-Item 'matrix-base/Matrix Server/data/mavenDependencies/FileStore.jar' 'tools/elder_souls_studio/cache_tools/FileStore.jar'
          New-Item 'tools/elder_souls_studio/cache_tools/bin' -ItemType Directory -Force | Out-Null
          javac -source 8 -target 8 -cp 'tools/elder_souls_studio/cache_tools/FileStore.jar' -d 'tools/elder_souls_studio/cache_tools/bin' 'tools/elder_souls_studio/cache_tools/CacheInject.java'

      - name: Bundle portable Java
        shell: pwsh
        run: |
          $url = 'https://api.adoptium.net/v3/binary/latest/8/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk'
          Invoke-WebRequest -Uri $url -OutFile jre8.zip
          Expand-Archive jre8.zip -DestinationPath jre8tmp
          $dir = Get-ChildItem jre8tmp -Directory | Select-Object -First 1
          New-Item 'tools/elder_souls_studio/runtime' -ItemType Directory -Force | Out-Null
          Copy-Item $dir.FullName 'tools/elder_souls_studio/runtime/jre8' -Recurse
          Copy-Item 'tools/elder_souls_studio/cache_tools/FileStore.jar' 'tools/elder_souls_studio/runtime/FileStore.jar'

      - name: Build desktop application
        shell: pwsh
        working-directory: tools/elder_souls_studio
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "Elder Souls Content Studio" `
            --add-data "cache_tools/bin;cache_tools/bin" `
            --add-data "runtime;runtime" `
            studio.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: tools/elder_souls_studio
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Get-FileHash 'installer/Elder-Souls-Content-Studio-Setup.exe' -Algorithm SHA256 | Format-List | Out-File 'installer/SHA256.txt'

      - name: Publish public installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: tools/elder_souls_studio
        run: |
          $tag = 'content-studio-latest'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Elder Souls Content Studio" --notes "Public one-click Windows installer for Elder Souls Content Studio."
          }
          gh release upload $tag 'installer/Elder-Souls-Content-Studio-Setup.exe' 'installer/SHA256.txt' --clobber
