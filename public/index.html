<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08080d" />
<title>Ciphered Souls</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="gameShell">
  <header class="topbar">
    <div>
      <strong>Ciphered Souls</strong>
      <span id="status">Connecting...</span>
    </div>
    <button id="ownerToggle" type="button">Owner</button>
  </header>

  <main class="viewportWrap">
    <canvas id="gameCanvas" width="960" height="540" aria-label="Ciphered Souls mobile browser test client"></canvas>
    <section class="hud">
      <div class="stat"><span>HP</span><b id="hp">100</b></div>
      <div class="stat"><span>C$</span><b id="cash">0</b></div>
      <div class="stat"><span>Zone</span><b id="zone">Dev Realm</b></div>
    </section>
  </main>

  <nav class="mobileControls" aria-label="Touch controls">
    <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
    <div class="actions">
      <button data-action="interact" type="button">Use</button>
      <button data-action="attack" type="button">Atk</button>
      <button data-action="inventory" type="button">Bag</button>
      <button data-action="menu" type="button">Menu</button>
    </div>
  </nav>
</div>

<aside id="ownerPanel" class="ownerPanel" aria-label="Owner command page">
  <div class="panelHead">
    <h2>Owner Command Page</h2>
    <button id="closeOwner" type="button">×</button>
  </div>
  <label>Owner Key<input id="ownerKey" type="password" placeholder="ciphered-souls-dev-owner" /></label>
  <div class="grid2">
    <label>Name<input id="itemName" placeholder="Example: Ashen Blade" /></label>
    <label>Rarity<select id="itemRarity"><option>COMMON</option><option>UNCOMMON</option><option>RARE</option><option>EPIC</option><option>LEGENDARY</option></select></label>
    <label>Attack<input id="itemAttack" type="number" value="10" /></label>
    <label>Defense<input id="itemDefense" type="number" value="5" /></label>
    <label>Utility<input id="itemUtility" type="number" value="0" /></label>
    <label>Requirement<input id="itemRequirement" type="number" value="1" /></label>
  </div>
  <button id="createItemBtn" type="button">Create / Value Item</button>
  <h3>Items</h3>
  <div id="itemList" class="itemList"></div>
</aside>

<script src="/app.js"></script>
</body>
</html>
