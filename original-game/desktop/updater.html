<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elder Souls Updater</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #ead9b5;
      background:
        radial-gradient(circle at 50% 24%, rgba(157,111,48,.18), transparent 36%),
        linear-gradient(#12100d,#090807);
      font-family: Georgia, "Times New Roman", serif;
      user-select: none;
    }
    .wrap { width: 84%; text-align: center; }
    .mark {
      width: 68px; height: 68px; margin: 0 auto 14px;
      border: 2px solid #9d7843; transform: rotate(45deg);
      display: grid; place-items: center;
      box-shadow: 0 0 30px rgba(196,146,71,.16);
    }
    .mark span {
      transform: rotate(-45deg);
      color: #e2bd76;
      font-size: 26px;
      font-weight: bold;
    }
    h1 {
      margin: 0;
      color: #e4bf78;
      letter-spacing: .20em;
      font-size: 22px;
    }
    #status { margin-top: 28px; font-size: 15px; }
    #detail { margin-top: 7px; font-size: 12px; opacity: .64; }
    .line {
      width: 100%; height: 2px; margin-top: 22px;
      background: linear-gradient(90deg,transparent,#8d6d3f,transparent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .28; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span>ES</span></div>
    <h1>ELDER SOULS</h1>
    <div id="status">Preparing Elder Souls...</div>
    <div id="detail">Checking the installed game</div>
    <div class="line"></div>
  </div>
  <script>
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    if (window.elderSoulsDesktop) {
      window.elderSoulsDesktop.onUpdateStatus((payload) => {
        status.textContent = payload.message || "";
        detail.textContent = payload.detail || "";
      });
    }
  </script>
</body>
</html>
